# 本地单容器跑后端：端口与宿主直接运行保持一致（8989）。
# MySQL(8806) / Redis(6606) 仍用宿主机上已在跑的实例，本文件不重复拉起。
services:
  backend:
    build:
      context: .
    image: wanderchain-backend:demo
    container_name: wanderchain-backend-demo
    ports:
      - "8989:8989"
    # 容器内的 127.0.0.1 是容器自己，依赖必须走宿主机的可达地址。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 数据源地址在 application.yml 里是字面量，这里用 Spring 的宽松绑定整体覆盖。
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:8806/wanderchain?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root_123456"
      SPRING_DATA_REDIS_HOST: "host.docker.internal"
      SPRING_DATA_REDIS_PORT: "6606"
      SPRING_DATA_REDIS_PASSWORD: "green-123!@qj"
      WANDERCHAIN_JWT_SECRET: "demo-only-jwt-secret-not-for-production"
      WANDERCHAIN_MEDIA_ROOT: "/app/media"
      # 封面图地址仍指向前端的同源代理，与本地开发时一致。
      WANDERCHAIN_MEDIA_PUBLIC_BASE_URL: "http://localhost:3000/api/media"
    volumes:
      # 复用宿主机的 media 目录，容器重建后已上传的封面图仍在。
      - ./media:/app/media
